name: Check

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff black==26.5.1 pytest
      - name: Lint
        run: |
          ruff check src/
          black --check src/
      - name: Test application and repository tools
        working-directory: .
        run: python -m pytest app/tests/ tests/ -v

  keyfinder-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S src/wechat_keyfinder -B build/keyfinder-tests -A x64 -DWKF_BUILD_TESTS=ON -DWKF_ENABLE_TEST_KEY=OFF
      - name: Build
        run: cmake --build build/keyfinder-tests --config Release
      - name: Run tests
        run: ctest --test-dir build/keyfinder-tests -C Release --output-on-failure
